<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>INFOSINT — Image Location</title><link rel="stylesheet" href="/styles.css?v=20"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css"></head><body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><span class="mark">IS</span><div>INFOSINT<small>IMAGE LOCATION</small></div></div><nav><button class="nav-item active" id="imageTab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM6 6v12h12V6zm2 8 2-2 2 2 2-3 2 3v2H8z"/></svg>Image Location</button></nav><div class="sidebar-foot">IMAGE GEOLOCATION<br><span>EXIF + MAP ANALYSIS</span></div></aside><button class="hamb" id="hamb" aria-label="Open navigation"><span></span><span></span><span></span></button><main class="main"><header><div><div class="eyebrow">OSINT / IMAGE GEOLOCATION</div><h1>Image Location</h1></div><div class="status"><i></i>ANALYZER READY</div></header><section class="upload-panel"><div class="upload-layout"><label class="drop" id="drop"><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><div class="upload-icon">+</div><h2>Drop an image here</h2><p>or choose a local image to inspect its location metadata</p><span class="file-name" id="fileName">Maximum 15 MB</span></label><div class="preview-card" id="previewCard" hidden><div class="preview-head"><span>IMAGE PREVIEW</span><button id="clearImage" type="button">Clear</button></div><div class="preview-frame"><img id="preview" alt="Selected image preview"></div><div class="preview-info" id="previewInfo">No image selected</div></div></div><button class="analyze" id="analyze" disabled>Analyze Image</button></section><section class="map-card"><div class="card-head"><div><h3>LOCATION MINIMAP</h3><span id="mapStatus">No location</span></div><div class="map-actions"><div class="coord-row"><input id="coords" placeholder="Latitude, Longitude" autocomplete="off"><button id="go" type="button">Go</button></div><div class="layers"><button id="street" class="active" type="button">Map</button><button id="satellite" type="button">Satellite</button></div></div></div><div id="map"></div></section><section id="results" class="results"><div class="empty"><div class="empty-icon">IMG</div><h2>Ready for image analysis</h2><p>Upload an image to inspect EXIF metadata and detect embedded GPS coordinates.</p></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script><script src="/app.js?v=20"></script></body></html>
