<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>INFOSINT — Image Location</title><link rel="stylesheet" href="/styles.css?v=10"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><span class="mark">IS</span><div>INFOSINT<small>IMAGE LOCATION</small></div></div><nav><button class="nav-item active" id="imageTab"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM6 6v12h12V6zm2 8 2-2 2 2 2-3 2 3v2H8z"/></svg>Image Location</button></nav><div class="sidebar-foot">IMAGE GEOLOCATION<br><span>EXIF + MAP ANALYSIS</span></div></aside><button class="hamb" id="hamb" aria-label="Open navigation"><span></span><span></span><span></span></button><main class="main"><header><div><div class="eyebrow">OSINT / IMAGE GEOLOCATION</div><h1>Image Location</h1></div><div class="status"><i></i>ANALYZER READY</div></header><section class="upload-panel"><label class="drop" id="drop"><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><div class="upload-icon">+</div><h2>Drop an image here</h2><p>or choose a local image to inspect its location metadata</p><span class="file-name" id="fileName">Maximum 15 MB</span></label><button class="analyze" id="analyze" disabled>Analyze Image</button></section><section class="map-tools"><div><div class="search-title">MAP COORDINATE SEARCH</div><div class="coord-row"><input id="coords" placeholder="Latitude, Longitude e.g. 40.7128, -74.0060" autocomplete="off"><button id="go">Go</button></div></div><div class="layers"><button id="street" class="active">Map</button><button id="satellite">Satellite</button></div></section><section id="results" class="results"><div class="empty"><div class="empty-icon">IMG</div><h2>Ready for image analysis</h2><p>Upload an image to inspect EXIF metadata and detect embedded GPS coordinates.</p></div></section><section class="map-card"><div class="card-head"><h3>LOCATION MINIMAP</h3><span id="mapStatus">No location</span></div><div id="map"></div></section></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/app.js?v=10"></script></body></html>
